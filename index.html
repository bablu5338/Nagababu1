<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        header {
            background: #24292f;
            color: white;
            text-align: center;
            padding: 30px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        main h2 {
            margin-bottom: 15px;
            color: #0969da;
        }

        main p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background: #0969da;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #0550ae;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            color: #666;
        }
    </style>
</head>

<body>
    <header>
        <h1>Welcome to My Website</h1>
        <p>My First GitHub Project</p>
    </header>

    <main>
        <h2>Hello, World! 👋</h2>
        <p>
            This is my first website hosted using GitHub.
            I created this page using HTML and CSS.
        </p>
        <a href="https://github.com/" class="button">Visit GitHub</a>
    </main>

    <footer>
        <p>© 2026 My First Website</p>
    </footer>
</body>
</html>
